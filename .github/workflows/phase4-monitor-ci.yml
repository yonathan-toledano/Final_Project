name: phase4-monitor-ci

on:
  pull_request:
    paths:
      - "phase4/**"
      - ".github/workflows/phase4-monitor-ci.yml"
  push:
    branches:
      - main
    paths-ignore:
      - "phase4/charts/monitor/values.yaml"
      - "phase4/argocd/monitor-application.yaml"

permissions:
  contents: read
  packages: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phase4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install app dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r monitor/requirements.txt

      - name: Python syntax check
        run: python -m py_compile monitor/monitor.py

      - name: Smoke test app
        run: |
          python -m uvicorn monitor.monitor:app --host 127.0.0.1 --port 8000 > /tmp/monitor.log 2>&1 &
          pid=$!
          trap 'kill $pid >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null && \
               curl -fsS http://127.0.0.1:8000/ready >/dev/null && \
               curl -fsS http://127.0.0.1:8000/metrics >/dev/null && \
               curl -fsS http://127.0.0.1:8000/status >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Server log:" && cat /tmp/monitor.log
          exit 1

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: helm lint charts/monitor

      - name: Helm template
        run: helm template monitor charts/monitor

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Terraform fmt
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Terraform init (no backend)
        run: terraform -chdir=terraform init -backend=false

      - name: Terraform validate
        run: terraform -chdir=terraform validate

      - name: Docker build
        uses: docker/build-push-action@v6
        with:
          context: phase4/monitor
          push: false
          tags: yonathantoledano/monitor:ci-${{ github.sha }}
