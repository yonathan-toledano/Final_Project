name: phase4-monitor-cd

on:
  push:
    branches:
      - main
    paths:
      - "phase4/monitor/**"
      - "phase4/charts/monitor/**"
      - ".github/workflows/phase4-monitor-cd.yml"

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: yonathantoledano/monitor

jobs:
  build-and-update-gitops:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[skip cd]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Docker Hub credentials are configured
        env:
          DOCKERHUB_TOKEN: ${{ secrets.HREMES }}
        run: |
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Repository secret HREMES is not configured"
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: yonathantoledano
          password: ${{ secrets.HREMES }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: phase4/monitor
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Update Helm values with immutable image tag
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import re

          path = Path('phase4/charts/monitor/values.yaml')
          text = path.read_text()
          sha = '${{ github.sha }}'
          deployed_at = datetime.now(timezone.utc).replace(microsecond=0).isoformat()

          replacements = {
              r'(?m)^  tag: .+$': f'  tag: {sha}',
              r'(?m)^  appVersion: .+$': f'  appVersion: "{sha}"',
              r'(?m)^  deployedAt: .+$': f'  deployedAt: "{deployed_at}"',
          }
          for pattern, replacement in replacements.items():
              text, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise RuntimeError(f'Expected exactly one match for {pattern!r}, got {count}')

          path.write_text(text)
          PY

      - name: Commit GitOps update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add phase4/charts/monitor/values.yaml
          if git diff --cached --quiet; then
            echo "No GitOps update needed"
            exit 0
          fi
          git commit -m "chore(phase4): update monitor image to ${{ github.sha }} [skip ci]"
          git push origin HEAD:main
