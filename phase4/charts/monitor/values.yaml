replicaCount: 1

image:
  repository: yonathantoledano/monitor
  tag: f20094dc0e0e1c06b5ab080199548bc3fa1d7a0c
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 80

ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts: []

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

env:
  appEnv: production
  tokenTtlSeconds: "86400"
  publicBaseUrl: "https://finalproject.networkyonathan.com"
  appVersion: "f20094dc0e0e1c06b5ab080199548bc3fa1d7a0c"
  deployedAt: "2026-08-15T08:43:36Z"

probes:
  readiness:
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  liveness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
