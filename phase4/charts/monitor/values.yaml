replicaCount: 1

image:
  repository: yonathantoledano/monitor
  tag: 16b2a5ca8ce68e41a81c13a4ac80c70837aa4b83
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 80

ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts: []

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

persistence:
  enabled: true
  storageClassName: local-path
  size: 1Mi

tokenSecretInitImage: busybox:1.36.1

env:
  appEnv: production
  tokenTtlSeconds: "86400"
  publicBaseUrl: "https://finalproject.networkyonathan.com"
  appVersion: "16b2a5ca8ce68e41a81c13a4ac80c70837aa4b83"
  deployedAt: "2026-08-15T09:43:11Z"

probes:
  readiness:
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  liveness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
