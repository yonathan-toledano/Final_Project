apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "monitor.fullname" . }}
  labels:
{{- include "monitor.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
{{- include "monitor.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
{{- include "monitor.selectorLabels" . | nindent 8 }}
    spec:
      initContainers:
        - name: init-token-secret
          image: {{ .Values.tokenSecretInitImage | quote }}
          command:
            - sh
            - -ec
            - |
              if [ ! -s /secret/token-secret ]; then
                umask 077
                head -c 48 /dev/urandom | base64 | tr -d '\n' > /secret/token-secret.tmp
                mv /secret/token-secret.tmp /secret/token-secret
              fi
          volumeMounts:
            - name: token-secret
              mountPath: /secret
      containers:
        - name: monitor
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          env:
            - name: APP_ENV
              value: {{ .Values.env.appEnv | quote }}
            - name: APP_VERSION
              value: {{ .Values.env.appVersion | quote }}
            - name: GIT_COMMIT_SHA
              value: {{ .Values.env.appVersion | quote }}
            - name: DEPLOYED_AT
              value: {{ .Values.env.deployedAt | default "" | quote }}
            - name: PUBLIC_BASE_URL
              value: {{ .Values.env.publicBaseUrl | quote }}
            - name: TOKEN_TTL_SECONDS
              value: {{ .Values.env.tokenTtlSeconds | quote }}
            - name: TOKEN_SECRET_FILE
              value: /var/run/monitor-secret/token-secret
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
{{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: token-secret
              mountPath: /var/run/monitor-secret
              readOnly: true
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
      volumes:
        - name: token-secret
          persistentVolumeClaim:
            claimName: {{ include "monitor.fullname" . }}-token
