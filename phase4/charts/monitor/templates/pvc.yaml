apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "monitor.fullname" . }}-token
  labels:
{{- include "monitor.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.persistence.storageClassName | quote }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
